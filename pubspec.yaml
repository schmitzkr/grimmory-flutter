name: grimmory
description: "Audiobook client for self-hosted Grimmory servers"
publish_to: 'none'
version: 0.11.10+33

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^3.4.2

  # Navigation
  go_router: ^18.0.0

  # HTTP
  dio: ^5.8.0+1

  # Token / server-URL storage
  flutter_secure_storage: ^11.0.0
  shared_preferences: ^2.5.2

  # OIDC login (Authentik or any IdP a self-hosted Grimmory instance is wired
  # to) — only oidc_core's pure-Dart PKCE/request utilities are used, not
  # the `oidc` Flutter wrapper's OidcUserManager or its native AppAuth/Auth
  # Tab plugins: Grimmory's /auth/oidc/callback wants the raw PKCE result
  # rather than a pre-exchanged token, and the browser round-trip is
  # url_launcher + app_links. Depending on oidc_core directly (rather than
  # `oidc` 0.13, whose 1.0-4.0 releases rewrote exactly those native parts)
  # keeps the Android build free of AppAuth's manifest placeholder.
  oidc_core: ^3.0.0
  app_links: ^7.2.1
  url_launcher: ^6.3.0

  # Models
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0

  # Background audio + Android Auto (MediaBrowserService) surface
  audio_service: ^0.18.15
  just_audio: ^0.10.6
  audio_session: ^0.2.4
  # Already a transitive dep of audio_service — declared directly since the
  # audio handler imports BehaviorSubject itself (for chapter-list state
  # alongside audio_service's own queue/mediaItem/playbackState subjects).
  rxdart: ^0.28.0

  # EPUB reading — WebView + epub.js under the hood, so it parses a real
  # local EPUB file directly rather than needing Grimmory's piecemeal
  # spine/manifest/resource-file endpoints (/api/v1/epub/**) at all.
  flutter_epub_viewer: ^2.0.0
  # Already a transitive dep — declared directly so the reader can read the
  # EPUB's spine (container.xml + OPF) itself for a size-based progress
  # fraction, the same figure Grimmory's web reader uses, as a fallback for
  # epub.js's percentage being 0 until its slow locations pass finishes.
  archive: ^4.2.0

  # Misc
  package_info_plus: ^10.2.0
  cached_network_image: ^4.0.0
  cupertino_icons: ^1.0.8
  # Private, permission-free storage location for offline audiobook downloads
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3
  build_runner: ^2.16.0
  freezed: ^4.0.1
  json_serializable: ^6.9.3
  # Already pulled in by flutter_test; declared so tests can import it
  # directly to drive Timer-based logic (the sleep timer) deterministically.
  fake_async: ^1.3.0

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  image_path: "assets/icon/icon.png"
  # Adaptive icon (Android 8+): background layer + a transparent-background
  # foreground glyph inset in the safe zone, composited by the launcher.
  # Background is fully transparent so the home-screen icon is just the
  # book glyph floating over the wallpaper, not a colored square/circle
  # behind it — both image_path (above) and this layer are transparent-
  # background PNGs now, no baked-in fill color anywhere.
  adaptive_icon_background: "#00000000"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  # Android 13+ themed icon: the system tints this layer's alpha shape with
  # the user's wallpaper-derived color, so it must carry no color of its
  # own -- a white silhouette on transparent, same as any adaptive layer.
  adaptive_icon_monochrome: "assets/icon/icon_monochrome.png"
