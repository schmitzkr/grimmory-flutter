name: Regenerate Launcher Icons

# One-off utility: flutter_launcher_icons is a manual generator, not a build
# step — changing assets/icon/*.png or the flutter_launcher_icons config in
# pubspec.yaml has no effect until `dart run flutter_launcher_icons` is run
# and its output (android/app/src/main/res/**) is committed. That step has
# been missed multiple times in this repo's history, silently no-op'ing
# icon changes. Run this manually (workflow_dispatch) on whatever branch
# has icon-related changes; it regenerates and commits the output back.
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  regen:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          cache: true

      - run: flutter pub get
      - run: dart run flutter_launcher_icons

      # The dispatch target branch is protected (PR + passing status checks
      # required). A direct push here -- even authenticated with a PAT
      # belonging to the repo admin -- is NOT actually bypass-eligible: that
      # was tried and confirmed rejected (a real GH013 on this exact step,
      # twice). The only approach release.yml's own "Commit version bump via
      # PR" step actually proved working is a genuine PR: push a side
      # branch with the PAT (side branches aren't protected), open a real PR
      # with the PAT (a PAT isn't the workflow's own GITHUB_TOKEN, so unlike
      # a GITHUB_TOKEN-authored PR, this one DOES trigger pull_request-event
      # workflows, i.e. pr-check.yml's required checks), wait for those
      # checks, then squash-merge -- a normal compliant merge needing no
      # bypass at all.
      - name: Commit regenerated icons
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PUSH_TOKEN }}
          RELEASE_PUSH_TOKEN: ${{ secrets.RELEASE_PUSH_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add android/app/src/main/res
          if git diff --cached --quiet; then
            echo "No icon changes to commit"
          else
            BRANCH="regen-icons/${{ github.run_id }}"
            git checkout -b "$BRANCH"
            git commit -m "chore: regenerate launcher icons"
            git config --unset-all "http.https://github.com/.extraheader" || true
            git remote set-url origin "https://x-access-token:${RELEASE_PUSH_TOKEN}@github.com/${{ github.repository }}.git"
            git push origin "$BRANCH"

            PR_URL=$(gh pr create \
              --base "${{ github.ref_name }}" \
              --head "$BRANCH" \
              --title "chore: regenerate launcher icons" \
              --body "Automated icon regeneration.")

            sleep 15
            gh pr checks "$PR_URL" --watch --interval 15
            gh pr merge "$PR_URL" --squash --delete-branch
          fi
