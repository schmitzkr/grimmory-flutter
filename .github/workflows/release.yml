name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Semver version, e.g. 0.2.0 (no leading v)"
        required: true
        type: string
      release_notes:
        description: "Optional release notes. Leave blank to auto-generate from commits since the last tag."
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          cache: true

      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test

  build-and-release:
    needs: analyze-test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # fetch-depth: 0 (full history + tags) is required by "Compute tag and
      # notes" below: actions/checkout defaults to a shallow depth-1 clone,
      # which has no tags at all, so `git describe --tags` always failed
      # silently and the notes generation always fell back to its "no last
      # tag" branch — `git log` on a 1-commit shallow history then only ever
      # produced a single bullet (the tip commit), no matter how many
      # commits actually shipped since the last release. Confirmed via
      # v0.11.0 and v0.11.1 both showing this exact one-line symptom.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Free disk space
        run: |
          echo "Disk space before cleanup:"
          df -h /
          # This job installs its own separate Android SDK/NDK at
          # /opt/hostedtoolcache/android-sdk (a stable, cacheable path
          # across runs) — the runner image's preinstalled SDK at
          # /usr/local/lib/android is never used, just wasted disk. Freeing
          # it plus a few other large preinstalled toolchains this build
          # doesn't touch reliably recovers 15-20GB. Needed: a real run
          # ran the disk down to 47MB free and failed two cache-save steps
          # with "No space left on device" (Android SDK platforms/NDK +
          # Gradle + Flutter SDK + build output + several caches tar'ing up
          # at once exceeded the runner's default free space).
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          echo "Disk space after cleanup:"
          df -h /

      - name: Compute tag and notes
        id: meta
        run: |
          set -euo pipefail
          TAG="v${{ inputs.version }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if [ -n "${{ inputs.release_notes }}" ]; then
            NOTES="${{ inputs.release_notes }}"
          else
            LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
            if [ -n "$LAST_TAG" ]; then
              NOTES=$(git log "${LAST_TAG}..HEAD" --pretty=format:'- %s')
            else
              NOTES=$(git log --pretty=format:'- %s')
            fi
          fi
          {
            echo "notes<<NOTES_EOF"
            echo "$NOTES"
            echo "NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Bump pubspec version
        run: |
          sed -i "s/^version: .*/version: ${{ inputs.version }}+${{ github.run_number }}/" pubspec.yaml

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Android SDK
        uses: actions/cache@v6
        with:
          path: /opt/hostedtoolcache/android-sdk
          key: android-sdk-37.0-buildtools-36.0.0

      # Point at the same path "Cache Android SDK" above targets, so a cache
      # hit is actually reused instead of setup-android re-downloading into
      # its own default location.
      - name: Point Android SDK at the cached path
        run: |
          echo "ANDROID_HOME=/opt/hostedtoolcache/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/opt/hostedtoolcache/android-sdk" >> "$GITHUB_ENV"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # API 37 only ships as minor-versioned platform packages (37.0,
          # 37.1, …) — there is no bare `platforms;android-37` id.
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          cache: true

      - run: flutter pub get

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/app/build.gradle*', 'android/build.gradle*', 'pubspec.lock') }}

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$HOME/grimmory.jks"
          echo "KEYSTORE_PATH=$HOME/grimmory.jks" >> "$GITHUB_ENV"

      - name: Build APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          flutter build apk --release --split-per-abi \
            --target-platform android-arm64 \
            --obfuscate --split-debug-info=build/debug_info

      - name: Rename APK
        run: mv build/app/outputs/flutter-apk/app-arm64-v8a-release.apk build/app/outputs/flutter-apk/grimreader.apk

      - name: Zip debug symbols
        run: (cd build/debug_info && zip -r ../../grimmory-debug-info.zip .)

      # "Bump pubspec version" above only edits the checkout's working tree
      # so the build reads the right version -- it was never committed, so
      # the repo's actual pubspec.yaml stayed at its original placeholder
      # version through every past release while the built APKs correctly
      # carried the real one. Commit it now, after the build has already
      # succeeded (so a failed build never leaves an orphaned version-bump
      # commit with no matching release), and tag the resulting commit.
      #
      # main is branch-protected (PR + passing status checks required). Two
      # earlier approaches each failed for a DIFFERENT reason:
      #   1. A plain push with the default GITHUB_TOKEN: rejected outright —
      #      github-actions[bot] isn't in the ruleset's bypass list (GitHub's
      #      "Integration" bypass actor type only works on org-owned repos,
      #      not personal accounts — confirmed via a real 422 on this repo).
      #   2. A direct push authenticated with a PAT (fine-grained AND classic
      #      both tried) belonging to the repo admin: also rejected, every
      #      time — confirmed via a real diagnostic push that personal
      #      access tokens are simply never treated as bypass-eligible by
      #      GitHub's Rulesets engine, regardless of the owning account's
      #      actual permissions. Only an SSH/OAuth-app-authenticated push
      #      (a real interactive session) got a "Bypassed rule violations"
      #      response.
      #
      # The fix: don't rely on bypass at all — satisfy the ruleset for real
      # via a genuine PR + passing checks. Open the version-bump PR using the
      # PAT (RELEASE_PUSH_TOKEN) instead of GITHUB_TOKEN specifically because
      # GitHub deliberately never triggers pull_request-event workflows (like
      # pr-check.yml, where the required status checks live) for anything
      # done with the default GITHUB_TOKEN — a real earlier attempt using
      # GITHUB_TOKEN for this got its PR stuck in "action_required" forever,
      # never running the checks it needed to merge. A PAT isn't the
      # workflow's own token, so that restriction doesn't apply: the checks
      # run for real, and once they pass, merging is a normal compliant PR
      # merge that needs no bypass at all.
      - name: Commit version bump via PR
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PUSH_TOKEN }}
          RELEASE_PUSH_TOKEN: ${{ secrets.RELEASE_PUSH_TOKEN }}
        run: |
          set -euo pipefail
          BRANCH="release/${{ steps.meta.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add pubspec.yaml
          git commit -m "chore: bump version to ${{ inputs.version }}+${{ github.run_number }}"

          # actions/checkout persists its own GITHUB_TOKEN auth as a
          # http.extraheader for github.com — clear it so it doesn't
          # conflict with the PAT's credentials embedded in the remote URL.
          git config --unset-all "http.https://github.com/.extraheader" || true
          git remote set-url origin "https://x-access-token:${RELEASE_PUSH_TOKEN}@github.com/${{ github.repository }}.git"
          git push origin "$BRANCH"

          PR_URL=$(gh pr create \
            --base "${{ github.ref_name }}" \
            --head "$BRANCH" \
            --title "chore: bump version to ${{ inputs.version }}" \
            --body "Automated version bump for release ${{ steps.meta.outputs.tag }}.")

          # gh pr checks --watch can start polling before GitHub has
          # scheduled any checks against a just-created PR and return
          # immediately with "no checks reported" — give the pull_request
          # event a moment to fan out before watching for real.
          sleep 15
          gh pr checks "$PR_URL" --watch --interval 15
          gh pr merge "$PR_URL" --squash --delete-branch

          git checkout "${{ github.ref_name }}"
          git fetch origin "${{ github.ref_name }}"
          git reset --hard "origin/${{ github.ref_name }}"
          git tag -a "${{ steps.meta.outputs.tag }}" -m "${{ steps.meta.outputs.tag }}"
          git push origin "${{ steps.meta.outputs.tag }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.tag }}
          body: ${{ steps.meta.outputs.notes }}
          files: |
            build/app/outputs/flutter-apk/grimreader.apk
            grimmory-debug-info.zip
