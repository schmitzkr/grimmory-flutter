name: PR Check

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          cache: true

      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test

  debug-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Free disk space
        run: |
          echo "Disk space before cleanup:"
          df -h /
          # This job installs its own separate Android SDK/NDK at
          # /opt/hostedtoolcache/android-sdk (a stable, cacheable path
          # across runs) — the runner image's preinstalled SDK at
          # /usr/local/lib/android is never used, just wasted disk. Freeing
          # it plus a few other large preinstalled toolchains this build
          # doesn't touch reliably recovers 15-20GB. Needed: a real run
          # ran the disk down to 47MB free and failed two cache-save steps
          # with "No space left on device" (Android SDK platforms/NDK +
          # Gradle + Flutter SDK + build output + several caches tar'ing up
          # at once exceeded the runner's default free space).
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          echo "Disk space after cleanup:"
          df -h /

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Android SDK
        uses: actions/cache@v6
        with:
          path: /opt/hostedtoolcache/android-sdk
          key: android-sdk-35-buildtools-35.0.0

      # Point at the same path "Cache Android SDK" above targets, so a cache
      # hit is actually reused instead of setup-android re-downloading into
      # its own default location.
      - name: Point Android SDK at the cached path
        run: |
          echo "ANDROID_HOME=/opt/hostedtoolcache/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/opt/hostedtoolcache/android-sdk" >> "$GITHUB_ENV"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          cache: true

      - run: flutter pub get

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/app/build.gradle*', 'android/build.gradle*', 'pubspec.lock') }}

      # Debug build only — no signing secrets needed, just proves the
      # Android/Gradle build actually compiles. Release builds are verified
      # separately by release.yml/dev-build.yml once signing is set up (M4).
      - run: flutter build apk --debug --target-platform android-arm64

  # Fails the PR if it introduces a dependency with a known vulnerability
  # (scans pubspec.lock against the OSV database), comparing against the
  # base branch so pre-existing advisories in unrelated deps don't block
  # every PR — same role govulncheck plays in this workspace's Go repos'
  # CI (see schm/.gitea's go-pr-check-reusable.yml). upload-sarif enables
  # the reusable workflow's default SARIF-to-Security-tab upload, which
  # needs GitHub Advanced Security — unavailable on a free-tier private
  # repo (which this one was), but free on any public repo (which this
  # one now is), giving a real Security tab instead of just failing the
  # PR check with no persistent record.
  vulnerability-scan:
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: "google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@v2.5.0"
    with:
      upload-sarif: true
