name: Dev Build

on:
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Free disk space
        run: |
          echo "Disk space before cleanup:"
          df -h /
          # This job installs its own separate Android SDK/NDK at
          # /opt/hostedtoolcache/android-sdk (a stable, cacheable path
          # across runs) — the runner image's preinstalled SDK at
          # /usr/local/lib/android is never used, just wasted disk. Freeing
          # it plus a few other large preinstalled toolchains this build
          # doesn't touch reliably recovers 15-20GB. Needed: a real run
          # ran the disk down to 47MB free and failed two cache-save steps
          # with "No space left on device" (Android SDK platforms/NDK +
          # Gradle + Flutter SDK + build output + several caches tar'ing up
          # at once exceeded the runner's default free space).
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          echo "Disk space after cleanup:"
          df -h /

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Android SDK
        uses: actions/cache@v5
        with:
          path: /opt/hostedtoolcache/android-sdk
          key: android-sdk-35-buildtools-35.0.0

      - name: Set up Android SDK
        run: |
          SDK_DIR="/opt/hostedtoolcache/android-sdk"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          echo "$SDK_DIR/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_DIR/platform-tools" >> "$GITHUB_PATH"
          if [ ! -f "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" ]; then
            mkdir -p "$SDK_DIR/cmdline-tools"
            wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
            unzip -q cmdline-tools.zip -d "$SDK_DIR/cmdline-tools"
            mv "$SDK_DIR/cmdline-tools/cmdline-tools" "$SDK_DIR/cmdline-tools/latest"
            yes | "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" --licenses || true
            "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          fi

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          cache: true

      - run: flutter pub get

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/app/build.gradle*', 'android/build.gradle*', 'pubspec.lock') }}

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$HOME/grimmory.jks"
          echo "KEYSTORE_PATH=$HOME/grimmory.jks" >> "$GITHUB_ENV"

      - name: Build APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: flutter build apk --release --split-per-abi --target-platform android-arm64

      - uses: actions/upload-artifact@v4
        with:
          name: grimmory-dev-build
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
